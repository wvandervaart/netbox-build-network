[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-build-network"
version = "0.1.1"
description = "NetBox plugin adding a menu item that GETs a buildnw URL with the current user"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["netbox_build_network*"]